version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: incidentiq-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - incidentiq-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: incidentiq-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - incidentiq-network

volumes:
  mongodb_data:
  qdrant_data:

networks:
  incidentiq-network:
    driver: bridge
